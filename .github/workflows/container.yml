name: Publish container

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  packages: write

# Serialize releases so two builds cannot publish latest simultaneously.
concurrency:
  group: ghcr-main
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Name image and skip superseded commits
        id: release
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          head="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$head" = "$COMMIT" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@v3
        if: steps.release.outputs.current == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.release.outputs.current == 'true'
      - uses: docker/login-action@v3
        if: steps.release.outputs.current == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish AMD64 and ARM64 images
        if: steps.release.outputs.current == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.release.outputs.image }}:latest
            ${{ steps.release.outputs.image }}:sha-${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=release-container
          cache-to: type=gha,mode=max,scope=release-container
      - name: Trigger deployment after publication (optional)
        if: steps.release.outputs.current == 'true'
        env:
          DEPLOY_WEBHOOK: ${{ secrets.DEPLOY_WEBHOOK }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_WEBHOOK" ] && [ -z "$DEPLOY_TOKEN" ]; then
            echo "Image published. No deployment webhook configured."
            exit 0
          fi
          if [ -z "$DEPLOY_WEBHOOK" ]; then
            echo "Set DEPLOY_WEBHOOK when supplying DEPLOY_TOKEN."
            exit 1
          fi
          headers=()
          if [ -n "$DEPLOY_TOKEN" ]; then
            headers+=(--header "Authorization: Bearer $DEPLOY_TOKEN")
          fi
          curl --fail --silent --show-error --max-time 60 --request POST \
            "${headers[@]}" "$DEPLOY_WEBHOOK"
